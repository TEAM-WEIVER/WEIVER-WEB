name: E2E

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  e2e:
    if: github.head_ref != 'automation/develop-to-main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Approve builds
        run: pnpm approve-builds --yes || true

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('**/package.json') }}
          restore-keys: |
            playwright-chromium-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        env:
          NEXT_PUBLIC_E2E_TEST: 'true'
        run: pnpm build

      - name: Run affected E2E tests
        if: github.event_name == 'pull_request'
        run: |
          if find e2e -name "*.spec.ts" | grep -q .; then
            E2E_BASE_REF=origin/${{ github.base_ref }} pnpm test:e2e:affected
          else
            echo "E2E 테스트 파일 없음 — 건너뜀"
          fi

      - name: Run full E2E tests
        if: github.event_name == 'push'
        run: |
          if find e2e -name "*.spec.ts" | grep -q .; then
            pnpm test:e2e --workers=2
          else
            echo "E2E 테스트 파일 없음 — 건너뜀"
          fi
