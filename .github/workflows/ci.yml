name: CI

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Test the PR merge commit, not only the feature branch HEAD.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/check-quality
